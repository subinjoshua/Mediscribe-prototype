# AWS SAM Template — MediScribe Prototype
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MediScribe Prototype — AWS AI for Bharat Hackathon

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 256
    Timeout: 60
    Environment:
      Variables:
        PATIENTS_TABLE: MediScribe-Patients
        DRUGS_TABLE: MediScribe-Drugs
        ALERTS_TABLE: MediScribe-Alerts
        S3_BUCKET: !Sub mediscribe-uploads-${AWS::AccountId}
        BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"

Resources:

  # ──────────────────────────────────────────────
  # S3 Bucket (for prescription uploads)
  # ──────────────────────────────────────────────

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub mediscribe-uploads-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - "*"

  # ──────────────────────────────────────────────
  # IAM Role (shared by all Lambdas)
  # ──────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MediScribeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediScribe-Patients
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediScribe-Patients/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediScribe-Drugs
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediScribe-Alerts
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::mediscribe-uploads-${AWS::AccountId}/*
              - Sid: TextractAccess
                Effect: Allow
                Action:
                  - textract:DetectDocumentText
                  - textract:AnalyzeDocument
                Resource: "*"
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6

  # ──────────────────────────────────────────────
  # Lambda Functions
  # ──────────────────────────────────────────────

  ProcessPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.process_photo.lambda_handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ProcessPhoto:
          Type: Api
          Properties:
            Path: /process-photo
            Method: POST

  ValidateRxFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.validate_rx.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ValidateRx:
          Type: Api
          Properties:
            Path: /validate-rx
            Method: POST

  CheckOutbreakFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.check_outbreak.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CheckOutbreak:
          Type: Api
          Properties:
            Path: /check-outbreak
            Method: POST

  OutbreakDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.outbreak_dashboard.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        OutbreakDashboard:
          Type: Api
          Properties:
            Path: /outbreak-dashboard
            Method: GET

  DischargeSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.discharge_summary.lambda_handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        DischargeSummary:
          Type: Api
          Properties:
            Path: /discharge-summary
            Method: POST

  GetPatientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.get_patients.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        GetAllPatients:
          Type: Api
          Properties:
            Path: /patients
            Method: GET
        GetPatientById:
          Type: Api
          Properties:
            Path: /patients/{id}
            Method: GET

  SeedDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambdas.seed_data.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        SeedData:
          Type: Api
          Properties:
            Path: /seed-data
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
